services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    restart: "no"
    depends_on:
      - redis
    networks:
      - app-network
